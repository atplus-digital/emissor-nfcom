name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test + coverage gate
    runs-on: ubuntu-latest
    services:
      # O gate de cobertura (bunfig.toml coverageThreshold) exige o teste de
      # integração do Flow (Redis real) — sem ele, o wiring dos workers fica
      # fora do denominador e o gate falha. `bun run test` (sem coverage) segue
      # verde sem Redis (o flow test skipIf gracioso).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        # setup-bun NÃO roda install (o input `cache` não existe nesta action —
        # só cacheia o executável do Bun). Sem deps o typecheck roda contra o
        # tsc global do runner e falha (TS2688/TS2307).
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test
      - name: Coverage gate
        run: bun run test:coverage

  gitleaks:
    name: Gitleaks (secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        # gitleaks-action@v3 exige license para repositórios de ORG (gitleaks.io).
        # O binário OSS segue livre (MIT) — mesmo comando do pre-commit
        # (scripts/gitleaks-check → `gitleaks protect --redact`).
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin/ gitleaks
          gitleaks --version
      - name: Detect secrets
        # detect varre o histórico (83+ commits); `protect` em v8.30.1 loga
        # "0 commits scanned" sem varrer — false pass. (O pre-commit segue com
        # protect --staged, que funciona — validado com fake secret.)
        run: gitleaks detect --source . --redact
