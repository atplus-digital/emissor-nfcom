name: Deploy

on:
  # O workflow só é INICIADO depois que o CI termina — sem "esperar" em job:
  # workflow_run dispara quando o workflow CI completa (types: [completed]).
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  # Re-deploy manual pelo UI do Actions
  workflow_dispatch:

concurrency:
  group: deploy-easypanel
  cancel-in-progress: false

jobs:
  deploy:
    name: Trigger deploy (EasyPanel)
    # Deploy automático só quando o CI completou com sucesso num push na main;
    # dispatch manual dispensa gate de CI.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      # URL de trigger do deploy do EasyPanel.
      # Configurar no repositório: Settings → Secrets and variables → Actions
      # (secret: DEPLOY_TRIGGER_URL).
      DEPLOY_TRIGGER_URL: ${{ secrets.DEPLOY_TRIGGER_URL }}
    steps:
      - name: GET no trigger de deploy
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_TRIGGER_URL:-}" ]; then
            echo "::error::Secret DEPLOY_TRIGGER_URL não está configurada no repositório"
            exit 1
          fi
          http_code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "User-Agent: github-actions-deploy" "$DEPLOY_TRIGGER_URL")
          echo "EasyPanel respondeu: $http_code"
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 400 ]; then
            echo "::error::Trigger do deploy falhou (HTTP $http_code)"
            exit 1
          fi
