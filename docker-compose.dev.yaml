# Dev local: sobe Redis + app (com hot-reload via `bun --watch`) + tunnel Cloudflare
# (preview URL pública) num único pod. `bun dev` roda `docker compose -f
# docker-compose.dev.yaml up`. Produção usa só o Dockerfile (bundle autocontido);
# este compose é tooling de desenvolvimento.
#
# Single-instance (ADR-0002/0003): NÃO escalar réplicas — o SQLite de coordenação
# (/app/data) não é compartilhável entre pods.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Sem `ports`: o Redis fica só na rede interna do compose (serviço `redis`).
    # O app o alcança via redis://redis:6379. Evita conflito com containers Redis
    # órfãos no host (ex: emissor-test-redis) que ocupariam a porta 6379.
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    env_file:
      - .env
    environment:
      # Override do .env: dentro do compose o Redis é o serviço `redis`, não
      # localhost. Os demais secrets vêm do .env via env_file.
      REDIS_URL: redis://redis:6379
      # Override do `.env`: no compose a porta INTERNA do container é fixa 3000
      # (bateria com EXPOSE 3000 do Dockerfile, o healthcheck que aponta p/
      # localhost:3000 e o serviço `tunnel`/`viewer` que alcançam o app via
      # app:3000). A porta de HOST é controlada por APP_PORT (port map abaixo),
      # NÃO por PORT. O `PORT` do `.env` só vale em `dev:native` (sem compose),
      # onde o Hono escuta direto no host.
      PORT: "3000"
      # SQLite de coordenação num VOLUME nomeado (não no bind mount do source).
      # Se ficasse em ./data (dentro de ./:/app), o `bun --watch` veria cada
      # escrita no DB (migrate, outbox, lease) como mudança de arquivo e
      # recarregaria o app num loop. Caminho idêntico ao do Dockerfile de prod.
      DATABASE_URL: "/app/data/emissor.db"
      NODE_ENV: development
    ports:
      # Host:container. Porta interna fixa 3000 (EXPOSE do Dockerfile / PORT
      # interno forçado acima). Porta de HOST dinâmica via .env (APP_PORT,
      # fallback 3333) p/ evitar colisão com outros dev servers no host
      # (ex: code-flow-runner em :3000). Host alcança a API em
      # http://localhost:${APP_PORT:-3333}.
      - "${APP_PORT:-3333}:3000"
    volumes:
      # Source montado para o `bun --watch` refletir edições locais a quente.
      - ./:/app
      # Preserva o node_modules da imagem (bind mount não o sobrescreve).
      - /app/node_modules
      # Volumes anônimos p/ cada sub-workspace: com `linker = "hoisted"`
      # (bunfig.toml) a maior parte das deps vive na raiz, mas o Bun procura
      # transitivas no node_modules do próprio pacote. Sem estes volumes o bind
      # mount ./:/app sobrescreve com o node_modules do host (incompleto em
      # workspaces) e o carregamento falha com ENOENT (pino-pretty, drizzle-orm…).
      - /app/apps/backend/node_modules
      - /app/apps/viewer/node_modules
      - /app/packages/db/node_modules
      - /app/packages/generated/node_modules
      # SQLite de coordenação ISOLADO do bind mount do source — volume nomeado.
      # Sem isso, escritas no DB disparariam reload do `bun --watch` (loop).
      - db-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    # Migra o SQLite de coordenação (idempotente, ADR-0009) antes de subir o
    # server — espelha o CMD do Dockerfile de produção.
    #
    # Roda como root só p/ dar ao volume nomeado /app/data (que o Docker cria
    # como root) ownership do `bun` (UID 1000); depois cai p/ `bun` via `su` p/
    # rodar o app sem root. O `bun --watch` enxerga só o source (bind mount) —
    # o DB vive no volume nomeado, isolado do watch (sem loop de reload).
    user: "0:0"
    command: sh -c "mkdir -p /app/data && chown -R 1000:1000 /app/data && su bun -c 'cd /app && bunx drizzle-kit migrate && bun --watch apps/backend/src/index.ts'"
    # Healthcheck no /health (rota pública de liveness, ADR-0002) — o serviço
    # `tunnel` depende dele p/ só abrir o preview após o app responder.
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  # Viewer (Vite) — app de visualização de faturas/notas (apps/viewer). Sobe no
  # mesmo `bun dev` que o app. Reusa a imagem buildada pelo serviço `app`: o
  # Dockerfile.dev, com `linker = "hoisted"` (bunfig.toml), instala as deps do
  # viewer no node_modules da raiz da imagem — sem rebuild/`bun install` extra.
  viewer:
    image: emissor-nfcom-app
    working_dir: /app
    env_file:
      - .env
    environment:
      # Proxy do Vite: /painel -> app (serviço interno do compose). O
      # vite.config.ts lê esta var; no host (dev sem compose) vale o default
      # http://localhost:3000.
      VITE_PROXY_TARGET: "http://app:3000"
    # Roda o binário `vite` do node_modules da imagem (hoisted) direto — sem
    # passar pelo script `dev` do package.json (que fixa `--port 5850`) p/ não
    # acumular flags conflitantes. Porta interna 5173 (canônica do container);
    # a publicada no host vem do .env via VIEWER_PORT. `--host` expõe na rede
    # interna p/ o tunnel e p/ o port map.
    command: sh -c "cd /app/apps/viewer && /app/node_modules/.bin/vite --port 5173 --host"
    ports:
      # Host:container. Porta interna 5173 (Vite); porta de HOST via .env
      # (VIEWER_PORT, fallback 3332). Host alcança o viewer em
      # http://localhost:${VIEWER_PORT:-3332}.
      - "${VIEWER_PORT:-3332}:5173"
    volumes:
      # Source montado p/ o Vite refletir edições locais a quente. Ao contrário
      # do serviço `app`, NÃO usamos volume anônimo em /app/node_modules: ele
      # incializa vazio (não copia da imagem) e esconderia as deps hoisted da
      # imagem — o Vite então não resolve `@tailwindcss/vite` (importado por
      # vite.config.ts) e falha ao carregar a config. Sem o volume, o
      # node_modules da imagem fica visível (hoisted p/ todos os workspaces).
      - ./:/app
    depends_on:
      app:
        condition: service_healthy

  # Tunnel Cloudflare (quick tunnel, URL efêmera https://<id>.trycloudflare.com)
  # que expõe o dev-server publicamente — útil p/ compartilhar o preview com
  # stakeholders ou receber webhooks externos. Sem login/conta/certificado: a URL
  # é gerada a cada `bun dev` e aparece nos logs deste serviço. `docker compose
  # down` derruba o tunnel junto com o pod — sem processos órfãos no host.
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --url http://app:3000 --no-autoupdate
    depends_on:
      app:
        condition: service_healthy

volumes:
  redis-data:
  db-data:
