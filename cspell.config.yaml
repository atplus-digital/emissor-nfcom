version: "0.2"
language: "en,pt_BR"
useGitignore: true
import:
  - "@cspell/dict-pt-br/cspell-ext.json"
ignorePaths:
  - node_modules
  - dist
  - build
  - coverage
  - .turbo
  - .cache
  - pnpm-lock.yaml
  - package-lock.json
  - bun.lock
  - bun.lockb
# Escapes de template string (`\t`, `\n`) colam a palavra seguinte — ignora
# o `\t` + palavra para não poluir o dicionário com falsos positivos.
ignoreRegExpList:
  - "\\\\t[a-z]+"
words:
  - AGENTS
  - api
  - apis
  - async
  - autofix
  - biome
  - bun
  - CDPATH
